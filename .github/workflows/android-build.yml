name: Build LAST DISTRICT V2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.2.9519653"

      - name: Download Godot 4.2.1 editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot
          curl -fL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip \
            -o godot-editor.zip
          unzip -q godot-editor.zip -d godot
          GODOT_BIN="godot/Godot_v4.2.1-stable_linux.x86_64"
          test -f "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Download matching Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz \
            -o godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/templates/4.2.1.stable"
          unzip -q godot-templates.tpz -d templates-unpacked
          if [ -d templates-unpacked/templates ]; then
            cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/templates/4.2.1.stable/"
          else
            cp -a templates-unpacked/. "$HOME/.local/share/godot/templates/4.2.1.stable/"
          fi
          test -f "$HOME/.local/share/godot/templates/4.2.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/templates/4.2.1.stable/android_release.apk"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="godot/Godot_v4.2.1-stable_linux.x86_64"
          test -f project.godot
          test -f scenes/Main.tscn
          test -f export_presets.cfg
          "$GODOT_BIN" --headless --path "$PWD" --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot/Godot_v4.2.1-stable_linux.x86_64 \
            --headless --path "$PWD" --export-debug "Android" build/LAST_DISTRICT_V2.apk
          test -s build/LAST_DISTRICT_V2.apk
          ls -lh build/LAST_DISTRICT_V2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAST_DISTRICT_V2-android-debug
          path: build/LAST_DISTRICT_V2.apk
          if-no-files-found: error
          retention-days: 14
